<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Kuis Matematika{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a href="{{ url_for('index') }}" class="logo">🎯 Kuis Matematika</a>
    <nav>
      {% if session.get('admin') %}
        <a href="{{ url_for('admin') }}">Admin</a>
        <a href="{{ url_for('admin_logout') }}">Keluar</a>
      {% else %}
        <a href="{{ url_for('admin') }}">Admin</a>
      {% endif %}
    </nav>
  </header>
  <main class="wrap">
    {% with pesan = get_flashed_messages() %}
      {% for p in pesan %}<div class="flash">{{ p }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
